<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="WhatsApp automation, built for real communities">
  <defs>
    <clipPath id="typing-window">
      <rect x="0" y="0" width="0" height="72">
        <animate attributeName="width" values="0;760;760;0" keyTimes="0;0.62;0.82;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <text x="8" y="48" fill="#d9d9d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" clip-path="url(#typing-window)">WhatsApp automation, built for real communities ‌⁭⁫✞.</text>
  <rect x="0" y="20" width="3" height="36" rx="1.5" fill="#ffffff">
    <animate attributeName="x" values="0;760;760;0" keyTimes="0;0.62;0.82;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.9;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
